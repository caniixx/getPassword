<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>getPassword</title>
</head>
<body>

    <script>

        function getPassword() {
           let inputUser = prompt(`Enter password. You got ${tryPassword} trys left. Password will reveal secret message.`);
           return inputUser;
        }

        let password = "Honig";
        let tryPassword = 3;

    function startPassword() {
       
        function comparePassword(inputUser, password) {
            if (inputUser === password) {
                tryPassword--;
                alert("Correct! The secret message is \n'Take it easy, but take it.'")
            } else {
                tryPassword--;
                alert(`Wrong password. You got ${tryPassword} left.`)
            }
        }

        let r = 1;
        while (r <= 3) {
            comparePassword(getPassword(), password)
            r++
        }
    } 

        startPassword();



    </script>
    
</body>
