<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>getPassword</title>
</head>
<body>

    <script>

        function getPassword() {
           let inputUser = prompt(`Enter password. You got ${tryPassword} tries left. Password will reveal secret message.`);
           return inputUser;
        }

        let password = "Honig";
        let tryPassword = 3;

    function startPassword() {
       
        function comparePassword(inputUser, password) {
            if (inputUser === password) {
                alert("Correct! The secret message is \n'Take it easy, but take it.'")
                return true;
            } else {
                tryPassword--;
                alert(`Wrong password. You got ${tryPassword} tries left.`);
                return false;
            }
        }

        let r = 1;
        let correct = false;
        while (r <= 3 && !correct) {
            correct = comparePassword(getPassword(), password)
            r++
        }

        function finalMsg() {
            if (!correct) {
                alert("You're out of tries. Refresh page in order to restart.")
            }
        }

        finalMsg();

    } 

    startPassword();



    </script>
    
</body>
</html>
